# Home server vhost for Monster Maker (template): LAN-only, behind an existing nginx.
# Replace monster.example.com with your name and 192.168.1.0/24 with your LAN:
#
#   sed 's/monster.example.com/monster.your-domain.tld/g' deploy/nginx/monster.conf \
#     | sudo tee /etc/nginx/sites-available/monster.conf
#   sudo ln -s /etc/nginx/sites-available/monster.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate: Let's Encrypt HTTP-01, so the A record must point at your public IP;
# the LAN restriction below is what keeps the app itself private. Order matters:
#   1. install this file with the two ssl_certificate lines commented out
#   2. sudo certbot --nginx -d monster.example.com
#   3. uncomment them, sudo nginx -t && sudo systemctl reload nginx
# Running certbot before a server block for the name exists makes it clone the
# default_server catch-all instead, which answers every request with 444.

upstream monster_maker {
    server 127.0.0.1:8095;
}

server {
    listen 80;
    listen [::]:80;
    server_name monster.example.com;

    # Left open so the certbot nginx plugin can answer the ACME challenge here,
    # exactly as it does for the other vhosts.
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monster.example.com;

    ssl_certificate /etc/letsencrypt/live/monster.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monster.example.com/privkey.pem;

    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    # The kids' drawings. No login anywhere in the app, so the house network is
    # the only credential: reachable from the LAN, 403 from everywhere else.
    allow 192.168.1.0/24;    # your LAN
    allow 127.0.0.1;
    # If the tablet resolves the name to the public IP and reaches nginx by NAT
    # loopback, the router rewrites its source to your WAN address and the tablet
    # gets 403s. Either give the router a local DNS entry pointing the name at the
    # server's LAN address (cleanest), or allow the WAN address here. Real external
    # clients keep their own source IP, so that admits the house, not the internet.
    # allow <your WAN IP>;
    # allow 100.64.0.0/10;   # uncomment to also reach it over Tailscale
    deny all;

    # Photos of drawings: MONSTER_MAX_UPLOAD_MB=25, nginx defaults to 1m.
    client_max_body_size 25m;

    access_log /var/log/nginx/monster-access.log;
    error_log /var/log/nginx/monster-error.log;

    location / {
        include snippets/proxy-params.conf;   # already sets proxy_buffering off, which the SSE progress stream needs
        proxy_pass http://monster_maker;
        proxy_read_timeout 1h;                # long-lived /events stream
    }
}
