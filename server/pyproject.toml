[project]
name = "monster"
version = "0.1.0"
description = "Monster Maker home server: API, job queue and CPU worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=11",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "manifold3d>=3",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
